services:
  app:
    build:
      context: ..
      dockerfile: .docker/php-fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: url-shortener-app
    restart: unless-stopped
    working_dir: /var/www/app
    volumes:
      - ../:/var/www/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - url-shortener

  nginx:
    image: nginx:1.27-alpine
    container_name: url-shortener-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../:/var/www/app:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - url-shortener

  mysql:
    image: mysql:8.4
    container_name: url-shortener-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-url_shortener}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - url-shortener

volumes:
  mysql-data:

networks:
  url-shortener:
    driver: bridge
